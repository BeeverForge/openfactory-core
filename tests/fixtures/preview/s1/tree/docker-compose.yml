# S1: a developer's own compose file. web and api are built from this repository with their code
# bind-mounted, db is an image, migrate runs once and finishes, `.env` is git-ignored — and the
# file carries what a laptop needs and a preview does not: ports, restart, extra_hosts, labels.
x-restart: &restart
  restart: unless-stopped

services:
  web:
    <<: *restart
    build: ./web
    ports:
      - "3000:3000"
    volumes:
      - ./web/src:/app/src
      - /app/node_modules
    environment:
      - API_URL=http://api:8000
      - NEXT_PUBLIC_API_URL=${OPENFACTORY_PREVIEW_URL_API:-http://localhost:8000}
    depends_on:
      - api
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: Host(`shop.example.com`)

  api:
    <<: *restart
    build:
      context: ./api
      args:
        PYTHON_VERSION: "3.12"
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      SECRET_KEY: ${SECRET_KEY:-dev-only}
      SENTRY_DSN: ${SENTRY_DSN}
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    # start_interval probes every 1 s inside start_period, so a test learns the api is healthy
    # within a second rather than a whole 5 s interval. It needs compose >= 2.20 and engine >= 25
    # (API 1.44); an older engine ignores it and probes every `interval`, as before (#1070).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      start_period: 30s
      start_interval: 1s

  migrate:
    build: ./api
    command: python manage.py migrate
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: tmpfs
        target: /run/postgresql
    # postgres runs `initdb` on a fresh volume every preview (`down -v`); compose's default of
    # 3 retries x 2 s with no start period loses that race on a loaded box, and `service_healthy`
    # fails the whole `up`. The suite's subject is the preview, not postgres's first start (#1070).
    # Whether the runtime should retry a client's `up` that lost this race is ADR-0050's call.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      start_period: 30s
      retries: 10
    ports:
      - "5432:5432"

volumes:
  pgdata:
